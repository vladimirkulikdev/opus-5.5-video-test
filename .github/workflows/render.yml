name: render-video
on:
  push:
    branches: [main]
  workflow_dispatch: {}
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - run: npm install
      - run: npm run render -- singularity.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: singularity-video
          path: singularity.mp4
