<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Singularity · ML anticheat · video</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { margin: 0; background: #000; color: #ddd; font-family: "JetBrains Mono", Menlo, Consolas, monospace; }
    #wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 16px; }
    canvas { width: min(96vw, calc((100vh - 110px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000; border: 1px solid #222; }
    #ui { display: flex; gap: 10px; align-items: center; width: min(96vw, calc((100vh - 110px) * 16 / 9)); }
    button { background: #000; color: #eee; border: 1px solid #555; padding: 6px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    button:hover { border-color: #fff; }
    input[type=range] { flex: 1; accent-color: #fff; }
    #time { min-width: 130px; text-align: right; font-size: 13px; color: #aaa; }
    #status { font-size: 12px; color: #888; min-height: 16px; }
    body.headless #ui, body.headless #status { display: none; }
    body.headless #wrap { padding: 0; }
    body.headless canvas { width: 1920px; border: 0; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas id="c" width="1920" height="1080"></canvas>
    <div id="ui">
      <button id="play">Pause</button>
      <button id="restart">Restart</button>
      <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
      <span id="time">0.0 / 0.0 s</span>
      <button id="record">Record WebM</button>
    </div>
    <div id="status">Space: play/pause · R: restart · Record WebM exports the full video in real time.</div>
  </div>
  <script src="src/util.js"></script>
  <script src="src/data.js"></script>
  <script src="src/blackhole.js"></script>
  <script src="src/player.js"></script>
  <script src="src/scenes.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
